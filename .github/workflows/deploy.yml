name: Build and Push Docker Images

on:
  push:
    branches: [test_unitaire]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and push backend
        run: |
          docker build -t saif4584851/pidevxbm-backend:latest ./backend
          docker push saif4584851/pidevxbm-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_API_URL="https://app.bmp.tn" \
            --build-arg VITE_GOOGLE_CLIENT_ID="913345195656-1ah0o5p6lk7lg2uvh8qob5mfcmdlap2c.apps.googleusercontent.com" \
            -t saif4584851/pidevxbmp-frontend:latest ./frontend
          docker push saif4584851/pidevxbmp-frontend:latest

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash ~/deploy-backend.sh
            bash ~/deploy-frontend.sh
