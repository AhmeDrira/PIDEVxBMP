name: Build and Push Docker Images

on:
  push:
    branches: [test_unitaire]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and push backend
        run: |
          docker build -t saif4584851/pidevxbm-backend:latest ./backend
          docker push saif4584851/pidevxbm-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build and push frontend
        run: |
          docker build -t saif4584851/pidevxbmp-frontend:latest ./frontend
          docker push saif4584851/pidevxbmp-frontend:latest
